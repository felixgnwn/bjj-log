name: CI

on:
  push:
    branches: [main]
  pull_request:

# Stop an older run when a newer commit arrives on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bjj
          POSTGRES_PASSWORD: bjj_ci_password
          POSTGRES_DB: bjj_log_test
        ports:
          - 5432:5432
        # Wait until Postgres accepts connections before the steps start
        options: >-
          --health-cmd "pg_isready -U bjj -d bjj_log_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://bjj:bjj_ci_password@localhost:5432/bjj_log_test
      TEST_DATABASE_URL: postgres://bjj:bjj_ci_password@localhost:5432/bjj_log_test
      NODE_ENV: test
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test
